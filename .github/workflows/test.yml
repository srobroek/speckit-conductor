name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          # No lockfile yet, so there is nothing to cache and the post-run step fails
          # on the missing path. Enable this once dependencies exist.
          enable-cache: false

      # Skips cleanly while tests/ is empty, so the gate exists from the first
      # commit rather than being added once something is already untested.
      - name: Run tests
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            uv run --with pytest pytest -q tests/
          else
            echo "no tests yet"
          fi

  scaffold:
    name: clean SpecKit scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install Specify CLI 1.0 development release
        run: uv tool install --from git+https://github.com/github/spec-kit.git specify-cli

      - name: Run setup and validate required extensions
        run: |
          repo="$PWD"
          project="$(mktemp -d)"
          cd "$project"
          git init -q .
          "$repo/.apm/skills/speckit-setup/scripts/setup-speckit.sh" --integration codex --render-for codex
          specify extension list --json | python3 -c '
          import json, sys
          required = {
              "agent-context", "agent-assign", "bugfix", "cleanup", "critique",
              "fix-findings", "iterate", "qa", "refine", "retro", "review",
              "roadmap", "security-review", "status-report", "tinyspec",
          }
          enabled = {item["id"] for item in json.load(sys.stdin) if item.get("enabled") is True}
          missing = required - enabled
          assert not missing, f"required extensions are not enabled: {sorted(missing)}"
          '
          sed -i 's/name: detect-changed-files/name: detect-changed-files.sh/' \
            .specify/extensions/review/extension.yml
          "$repo/.apm/skills/speckit-setup/scripts/setup-speckit.sh" --integration codex --render-for codex
          specify extension list --json | python3 -c '
          import json, sys
          review = next(item for item in json.load(sys.stdin) if item["id"] == "review")
          assert review.get("enabled") is True, "setup did not repair corrupted review"
          '

      - name: Reject a missing required extension
        run: |
          repo="$PWD"
          project="$(mktemp -d)"
          broken_setup="$project/setup-speckit.sh"
          sed 's#review=https://github.com/ismaelJimenez/spec-kit-review/archive/9ff6df9d967ed8d3606d3312900d1011feb522d9.zip#review=https://127.0.0.1:9/missing.zip#' \
            "$repo/.apm/skills/speckit-setup/scripts/setup-speckit.sh" > "$broken_setup"
          chmod +x "$broken_setup"
          cd "$project"
          git init -q .
          if "$broken_setup" --integration codex --render-for codex; then
            echo "setup accepted a missing required extension" >&2
            exit 1
          fi

  # v1.0.0 and v1.1.0 both shipped a package `apm install` REJECTED: APM requires a
  # .apm/ directory and neither release had one. The version resolved and the install
  # failed, which is the worst shape for a consumer. This gate is the install itself,
  # so the release cannot regress that way again.
  installable:
    name: apm install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      # apm-cli is the Microsoft-published PyPI package (MIT), the same one mise
      # installs here as pipx-apm-cli. It is not an npm package.
      - name: Install this package from the working tree
        run: |
          uv tool install apm-cli
          mkdir -p /tmp/probe && cd /tmp/probe
          git init -q .
          cat > apm.yml <<'YAML'
          name: install-probe
          version: 0.1.0
          description: Probe that the package under test is a valid APM package.
          author: ci
          YAML
          # Local path install: proves the package validates without waiting for a tag.
          apm install "$GITHUB_WORKSPACE" --target claude

  formulas:
    name: bd cook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # `bd cook` is the formula diagnostic. `bd mol pour` reports every formula
      # error as "not found as formula or proto ID" while naming a file that exists,
      # so a broken formula looks like a missing one.
      - name: Install bd
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          install: true
          cache: true

      - name: Cook every formula
        run: |
          shopt -s nullglob
          found=0
          # `bd cook` resolves the formula through a workspace, so a database has to
          # exist first: without it every cook fails "no beads database found",
          # which reads as a broken formula rather than a missing init. The tracked
          # .beads/metadata.json points at the developer machine's shared Dolt server,
          repo="$PWD"
          kitchen="$(mktemp -d)"
          cd "$kitchen"
          git init -q .
          bd init --quiet --skip-hooks --skip-agents --prefix kitchen
          mkdir -p .beads/formulas
          for f in "$repo"/formulas/*.formula.toml; do
            found=1
            name="$(basename "$f" .formula.toml)"
            echo "== $name"
            cp "$f" .beads/formulas/
            bd cook "$name" >/dev/null
          done
          [ "$found" -eq 1 ] || echo "no formulas yet"
